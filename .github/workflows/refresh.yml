name: Refresh rosters

on:
  schedule:
    - cron: "0 11 * * *"   # every day, 6 AM US Eastern (11:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull rosters, contracts, stats and transactions
        run: bash build.sh
      - name: Sanity check
        run: |
          t=$(jq '.teams|length' data.json); n=$(jq '[.teams[].players[]]|length' data.json); s=$(jq '.sal|length' data.json)
          echo "teams=$t players=$n contracts=$s"
          if [ "$t" -ne 30 ] || [ "$n" -lt 400 ] || [ "$s" -lt 300 ]; then echo "Data looks incomplete; keeping yesterday's data."; exit 1; fi
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Daily roster refresh $(date -u +%Y-%m-%d)"
          git push
